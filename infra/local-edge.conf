# Local stand-in for the two OpenShift Routes on one hostname:
#   /    → sila-web
#   /v1  → sila-api (including the chat WebSocket at /v1/sila/ws)
server {
    listen 8080;
    client_max_body_size 50m;

    location /v1/ {
        proxy_pass http://sila-api:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://sila-web:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
